# ZOOKA-AI, self-hosted.
#
# Four services that do four jobs, plus PostgreSQL. Nothing here calls a vendor API, and
# nothing requires a paid service:
#
#   web        the Next.js app (frontend + REST API)          http://localhost:3000
#   worker     background execution, safe to scale            no ports
#   scheduler  single leader for dispatch and lease repair     no ports
#   migrate    one-shot, runs before web/worker start          no ports
#
# Start:  docker compose --env-file .env.selfhost up -d --build
# Scale:  docker compose up -d --scale worker=4
# Logs:   docker compose logs -f worker scheduler

name: zooka

x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-zooka}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zooka}
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
  AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  STORAGE_LOCAL_DIR: /data/storage

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zooka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-zooka}
      # Deterministic locale and checksums, so a dump restores into the same semantics.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zooka} -d ${POSTGRES_DB:-zooka}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: migrate
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      <<: *app-env
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      <<: *app-env
      # Concurrency is per process. Raise it to the cores you own; the platform imposes
      # no ceiling, and there is no application-level cap to hit.
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
      WORKER_LEASE_MS: ${WORKER_LEASE_MS:-120000}
    volumes:
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  scheduler:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: scheduler
    restart: unless-stopped
    environment:
      <<: *app-env
      SCHEDULER_INTERVAL_MS: ${SCHEDULER_INTERVAL_MS:-30000}
      SCHEDULER_BATCH_SIZE: ${SCHEDULER_BATCH_SIZE:-10}
      SCHEDULER_GLOBAL_LIMIT: ${SCHEDULER_GLOBAL_LIMIT:-10}
      SCHEDULER_PER_ORG_LIMIT: ${SCHEDULER_PER_ORG_LIMIT:-5}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Optional object storage. Enable with: docker compose --profile object-storage up -d
  # then set STORAGE_DRIVER=s3 and the S3_* variables in .env.selfhost.
  minio:
    image: minio/minio:latest
    profiles: ["object-storage"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-zooka}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-zooka-secret}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

volumes:
  postgres-data:
  storage:
  minio-data:
