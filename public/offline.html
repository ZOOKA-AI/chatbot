<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZOOKA-AI — غير متصل</title>
    <meta name="theme-color" content="#2E86AB" />
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      :root {
        color-scheme: dark;
        --royal: #2e86ab;
        --purple: #a23b72;
        --snow: #f8f9fa;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, rgba(46, 134, 171, 0.28), transparent 55%),
          radial-gradient(circle at 80% 70%, rgba(162, 59, 114, 0.26), transparent 55%),
          #0f172a;
        color: var(--snow);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial,
          "Noto Sans Arabic", sans-serif;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 420px;
        padding: 32px 24px;
        border-radius: 20px;
        border: 1px solid rgba(248, 249, 250, 0.14);
        background: rgba(15, 23, 42, 0.72);
        backdrop-filter: blur(8px);
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        margin-bottom: 18px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 10px;
      }
      p {
        margin: 0 0 18px;
        line-height: 1.7;
        color: rgba(248, 249, 250, 0.78);
        font-size: 0.95rem;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 0;
        border-radius: 999px;
        padding: 12px 26px;
        color: #fff;
        background: linear-gradient(135deg, var(--royal), var(--purple));
      }
      .tag {
        display: block;
        margin-top: 18px;
        font-size: 0.78rem;
        color: rgba(248, 249, 250, 0.5);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="ZOOKA-AI" />
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>
        الصفحة التي طلبتها تحتاج اتصالًا. تحقق من الشبكة ثم أعد المحاولة، وسيعمل التطبيق
        كما هو دون فقدان أي شيء.
      </p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
      <span class="tag">ZOOKA-AI — تقنية بإيمان، تقدم بأخلاق</span>
    </main>
  </body>
</html>
